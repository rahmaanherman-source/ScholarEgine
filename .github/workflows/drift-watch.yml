name: APEX Drift Watch
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    paths: ['slab-zero/**']
jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run Drift Watch tests
        working-directory: slab-zero
        run: python -m unittest tests/test_drift.py -v
      - name: Run Gatekeeper drift command
        working-directory: slab-zero
        run: python gatekeeper.py drift
