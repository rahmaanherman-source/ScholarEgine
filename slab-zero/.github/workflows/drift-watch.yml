name: APEX Drift Watch

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slab-zero
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Drift Watch
        id: drift
        continue-on-error: true
        run: python gatekeeper.py drift
      - name: Commit audit state when changed
        run: |
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- slab-zero/manifest.json; then
            echo "No manifest changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slab-zero/manifest.json
          git commit -m "audit(slab-zero): record drift watch result"
          git push
      - name: Fail workflow on detected drift
        if: steps.drift.outcome == 'failure'
        run: exit 1
