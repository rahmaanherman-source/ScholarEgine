name: Slab-Zero Tests

on:
  push:
    paths:
      - 'slab-zero/**'
  pull_request:
    paths:
      - 'slab-zero/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slab-zero
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed test suite
        run: python -m unittest discover -s tests -v
